# dnsmasq configuration for whitelist-only
interface=eth0  # Use the appropriate interface
bind-interfaces  # Bind to the interface
listen-address=0.0.0.0  # Listen on all addresses

# Prevent DNS queries to any domains not listed in the whitelist
domain-needed  # Don't forward plain names
bogus-priv  # Don't forward private reverse lookups
no-resolv  # Don't use /etc/resolv.conf

# Whitelist specific domains
# You can add as many as needed
address=/example.com/192.168.1.100
address=/anotherdomain.com/192.168.1.100

# Use Google DNS as upstream for valid queries
server=8.8.8.8  # Fallback for domains not in the whitelist
server=8.8.4.4  # Backup
