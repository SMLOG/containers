worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;



        # Handle absolute paths for service3000 (e.g., /static)
		location / {
		    proxy_no_cache 1;
			proxy_cache_bypass 1;
		}
        location /service3000/ {

            proxy_pass http://localhost:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";
            sub_filter '/static' '/service3000/static';
            sub_filter '/api' '/service3000/api';
            sub_filter_types *;
            sub_filter_once off;

        }

        location /todo/ {

            proxy_pass http://localhost:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";
            sub_filter '/static' '/todo/static';
            sub_filter '/src' '/todo/src';
            sub_filter '/@vite' '/todo/@vite';
            sub_filter '/node_modules' '/todo/node_modules';
            sub_filter '/@id' '/todo/@id';
			
            sub_filter_types *;
            sub_filter_once off;

        }
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
		error_log /var/log/nginx/error.log debug;
    }
}